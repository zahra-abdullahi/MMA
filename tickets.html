<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Tickets</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to your CSS file -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css"> <!-- FullCalendar CSS -->
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script> <!-- FullCalendar JS -->
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/logo.png" alt="Mile-HI Muslim Athletics Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="stats.html">Stats</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="tickets.html">Tickets</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Purchase Game Tickets</h2>
        <div id="calendar"></div>

        <!-- Ticket Purchase Form (Hidden by Default) -->
        <div id="ticket-form" style="display: none;">
            <h3>Purchase Tickets</h3>
            <p id="selected-game"></p>
            <input type="hidden" id="selected-game-title" value="">
            <label for="quantity">Quantity (Max 20):</label>
            <input type="number" id="quantity" min="1" max="20" value="1">
            <p>Total: $<span id="total-price">10</span></p>
            <button id="checkout-button">Buy Now</button>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                events: [
                    { title: 'Game 1', start: '2025-04-12', description: 'Game 1 - $10' },
                    { title: 'Game 2', start: '2025-04-19', description: 'Game 2 - $10' },
                    { title: 'Game 3', start: '2025-04-26', description: 'Game 3 - $10' }
                ],
                eventClick: function(info) {
                    document.getElementById('ticket-form').style.display = 'block';
                    document.getElementById('selected-game').textContent = `You are purchasing tickets for: ${info.event.title} - $10`;
                    document.getElementById('selected-game-title').value = info.event.title;
                    document.getElementById('quantity').value = 1;
                    document.getElementById('total-price').textContent = 10;
                }
            });
            calendar.render();
        });

        document.getElementById('quantity').addEventListener('input', function() {
            const quantity = this.value;
            const pricePerTicket = 10;
            document.getElementById('total-price').textContent = quantity * pricePerTicket;
        });

        document.getElementById("checkout-button").addEventListener("click", async () => {
            const quantity = document.getElementById("quantity").value;
            const gameTitle = document.getElementById("selected-game-title").value;
            const totalPrice = quantity * 10;

            const response = await fetch("/create-checkout-session", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ quantity, totalPrice, gameTitle })
            });

            const session = await response.json();
            const stripe = Stripe("pk_test_51R2IKxQwM9j9DUoE0dWtfcLzjrNg89AVaaxcVbVrMLjnI1xorShkJP9TsFYAVXw95p7t7uTD85kzPRUQGO9r3FRj00WZfKvhhO");
            stripe.redirectToCheckout({ sessionId: session.id });
        });
    </script>
</body>
</html>
