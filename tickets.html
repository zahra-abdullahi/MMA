<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tickets | Mile-HI Muslim Athletics</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Open+Sans&display=swap" rel="stylesheet">
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    :root {
      --black: #000;
      --white: #fff;
      --accent: #f94c10;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      background: var(--black);
      color: var(--white);
      overflow-x: hidden;
    }

    header {
      background: var(--black);
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 999;
    }

    header img {
      height: 50px;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
    }

    .hamburger div {
      width: 25px;
      height: 3px;
      background-color: var(--white);
      margin: 4px 0;
    }

    nav {
      display: flex;
      gap: 1.5rem;
    }

    nav a {
      color: var(--white);
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
    }

    nav a:hover {
      color: var(--accent);
    }

    .title {
      text-align: center;
      font-family: 'Archivo Black', sans-serif;
      font-size: 3rem;
      margin-top: 2rem;
    }

    .ticket-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 2rem;
      margin: 3rem auto;
      max-width: 1200px;
    }

    .ticket {
      background: var(--white);
      color: var(--black);
      padding: 2.5rem;
      border-radius: 16px;
      text-align: center;
      font-family: 'Archivo Black', sans-serif;
      cursor: pointer;
      width: 320px;
      transition: transform 0.3s ease;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .ticket:hover {
      transform: scale(1.05);
    }

    .ticket button {
      margin-top: 1rem;
      background: var(--black);
      color: var(--white);
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
    }

    .ticket button:hover {
      background: var(--accent);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal-content {
      background: white;
      color: black;
      padding: 2rem;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      position: relative;
    }

    .modal-content input {
      width: 100%;
      padding: 12px;
      margin: 0.7rem 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .modal-content button {
      padding: 12px 24px;
      background: black;
      color: white;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      font-family: 'Archivo Black', sans-serif;
      cursor: pointer;
    }

    .modal-content button:hover {
      background: var(--accent);
    }

    .close {
      position: absolute;
      top: 10px;
      right: 18px;
      font-size: 1.5rem;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 2rem;
      background: #0a0a0a;
      font-size: 0.9rem;
      color: #888;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    @media screen and (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        display: none;
        flex-direction: column;
        width: 100%;
        padding-top: 1rem;
      }

      nav.active {
        display: flex;
      }

      .hamburger {
        display: flex;
        position: absolute;
        right: 2rem;
        top: 1.5rem;
      }

      .title {
        font-size: 2rem;
      }

      .ticket {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <header>
    <img src="images/logo.png" alt="Logo" />
    <div class="hamburger" onclick="toggleMenu()" id="hamburger">
      <div class="bar1"></div>
      <div class="bar2"></div>
      <div class="bar3"></div>
    </div>
    <nav id="nav">
      <a href="index.html">Home</a>
      <a href="events.html">Events</a>
      <a href="tickets.html">Tickets</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="title">GAME DROPS</div>

  <div class="ticket-row">
    <div class="ticket" onclick="openModal('Game 1')">
      <p>GAME DROP</p>
      <h3>Game 1</h3>
      <p>April 12</p>
      <p>$10</p>
      <button>Buy</button>
    </div>
    <div class="ticket" onclick="openModal('Game 2')">
      <p>GAME DROP</p>
      <h3>Game 2</h3>
      <p>April 19</p>
      <p>$10</p>
      <button>Buy</button>
    </div>
    <div class="ticket" onclick="openModal('Game 3')">
      <p>GAME DROP</p>
      <h3>Game 3</h3>
      <p>April 26</p>
      <p>$10</p>
      <button>Buy</button>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">×</span>
      <h2 id="modal-title">Game Ticket</h2>
      <input type="email" id="email" placeholder="Enter your email" required>
      <input type="number" id="quantity" placeholder="Quantity (1–20)" min="1" max="20" value="1">
      <button onclick="buyTickets()">Buy Now</button>
    </div>
  </div>

  <footer>
    &copy; 2025 Mile-HI Muslim Athletics. All rights reserved.<br>
    Need help? <a href="tel:3039011502">(303) 901-1502</a>
  </footer>

  <script>
    const API_BASE_URL = "https://your-api-url.com"; // Replace with your Render backend URL
    let selectedGame = "";

    function toggleMenu() {
      document.getElementById("nav").classList.toggle("active");
    }

    function scrollToCTA() {
      document.getElementById("cta").scrollIntoView({ behavior: "smooth" });
    }

    function openModal(game) {
      selectedGame = game;
      document.getElementById("modal-title").innerText = `Get Tickets for ${game}`;
      document.getElementById("modal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    async function buyTickets() {
      const email = document.getElementById("email").value;
      const quantity = parseInt(document.getElementById("quantity").value);

      if (!email || quantity < 1 || quantity > 20) {
        alert("Please enter a valid email and ticket quantity.");
        return;
      }

      try {
        await fetch(`${API_BASE_URL}/send-ticket`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, game: selectedGame, quantity })
        });

        const res = await fetch(`${API_BASE_URL}/create-checkout-session`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ game: selectedGame, quantity })
        });

        const session = await res.json();
        const stripe = Stripe("pk_test_51R2IKxQwM9j9DUoE0dWtfcLzjrNg89AVaaxcVbVrMLjnI1xorShkJP9TsFYAVXw95p7t7uTD85kzPRUQGO9r3FRj00WZfKvhhO");
        stripe.redirectToCheckout({ sessionId: session.id });
      } catch (err) {
        alert("Something went wrong. Please try again.");
        console.error(err);
      }
    }
  </script>

</body>
</html>
